name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync website files to S3
        run: |
          aws s3 sync . s3://ww7-docsie-io \
            --size-only \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".venv/*" \
            --exclude ".idea/*" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "da/assets/*" \
            --exclude "de/assets/*" \
            --exclude "es/assets/*" \
            --exclude "fr/assets/*" \
            --exclude "hu/assets/*" \
            --exclude "it/assets/*" \
            --exclude "ja/assets/*" \
            --exclude "ko/assets/*" \
            --exclude "nl/assets/*" \
            --exclude "pl/assets/*" \
            --exclude "pt-br/assets/*" \
            --exclude "pt-pt/assets/*" \
            --exclude "ru/assets/*" \
            --exclude "sv/assets/*" \
            --exclude "tr/assets/*" \
            --exclude "zh/assets/*" \
            --cache-control "public, max-age=31536000"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3IQ2X1LN0DB5H \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "✅ Website deployed to S3: s3://ww7-docsie-io"
          echo "✅ CloudFront cache invalidated"
          echo "🌐 Site will be live at: https://ww7.docsie.io"
