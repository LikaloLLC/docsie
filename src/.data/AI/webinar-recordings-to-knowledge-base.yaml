    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about video-to-documentation conversion"
      faq_categories:
        - title: "How It Works"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "How is this different from basic transcription tools?"
              answer: "Most tools only convert speech to text. Docsie's multimodal AI actually watches and analyzes the video content—reading on-screen text, identifying UI elements, detecting code in IDEs, capturing key visual moments, and correlating what's said with what's shown. It's the difference between having a typist versus having an intelligent analyst watch your video."
            - question: "What video formats are supported?"
              answer: "We support all major video formats including MP4, MOV, AVI, WebM, MKV, and more. You can also provide YouTube URLs or links to videos hosted on other platforms."
            - question: "How long does the conversion process take?"
              answer: "Processing time varies by video length, but typically runs at about 15-20% of the video duration. A 30-minute video is usually ready in 5-10 minutes."
        - title: "Quality & Accuracy"
          icon: "fas fa-check-circle"
          questions:
            - question: "How accurate is the transcription and visual analysis?"
              answer: "Our AI achieves 95%+ accuracy with clear audio and technical content. The visual analysis (OCR, UI element detection, code recognition) is similarly accurate and trained specifically on technical content, IDEs, and documentation scenarios."
            - question: "Can I edit the generated documentation?"
              answer: "Absolutely! The AI-generated documentation serves as a solid first draft that you can edit, refine, and customize using Docsie's built-in editor. All formatting and structure is preserved."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

