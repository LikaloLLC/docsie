    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting pharma training to FDA-compliant documentation"
      faq_categories:
        - title: "FDA Compliance & Validation"
          icon: "fas fa-shield-alt"
          badge: "Most Popular"
          questions:
            - question: "Can I use this for FDA-regulated documentation and GMP training?"
              answer: "Yes. Docsie generates documentation with audit trails, version control, and timestamps that support FDA regulatory requirements. The system maintains a complete record of all changes and helps create documented evidence of training completion for regulatory submissions."
            - question: "Can I use this for GMP training documentation required by FDA?"
              answer: "Absolutely. Docsie converts GMP training videos into written procedures, SOPs, and training records that FDA auditors expect to see. The system automatically structures content to match GMP documentation requirements and maintains traceability to the original training video."
            - question: "How does this handle validation protocols (IQ/OQ/PQ)?"
              answer: "Docsie's AI recognizes validation terminology and automatically structures Installation Qualification, Operational Qualification, and Performance Qualification procedures. It captures acceptance criteria, test procedures, and results documentation in a format suitable for validation packages."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand pharmaceutical terminology and GMP concepts?"
              answer: "Yes. Our multimodal AI is trained on pharmaceutical and regulatory content. It recognizes GMP terminology, regulatory citations (21 CFR, ICH guidelines), process validation concepts, and pharmaceutical manufacturing procedures—ensuring accurate documentation that doesn't misinterpret critical compliance terms."
            - question: "Can I customize the documentation format for our QMS?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit and format to match your Quality Management System requirements. All SOP numbering, formatting, and approval workflows can be customized while maintaining the core content integrity."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

