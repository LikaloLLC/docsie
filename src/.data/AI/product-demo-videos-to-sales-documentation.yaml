    faq_v2:
      badge: "Common Questions"
      title: "Sales Documentation FAQ"
      description: "Everything you need to know about converting demos to sales collateral"
      faq_categories:
        - title: "Sales Collateral Generation"
          icon: "fas fa-briefcase"
          badge: "Most Popular"
          questions:
            - question: "Can you extract competitive differentiators and objection handling from demos?"
              answer: "Yes. Docsie identifies when you mention competitors during demos—how you position your product versus Competitor X, objection handling, and win themes. It structures these as competitive battlecards your entire sales team can use."
            - question: "Does this work for discovery calls and custom demos?"
              answer: "Absolutely. Docsie works with any product demo—scripted demos, discovery call recordings, bake-offs, or proof-of-concept walkthroughs. It extracts the features shown and benefits discussed regardless of format."
            - question: "Can I customize the collateral for different industries or buyer personas?"
              answer: "Yes. Docsie recognizes when you're demoing for specific verticals (healthcare, finance, manufacturing) or personas (technical buyer, economic buyer, end user). It generates industry-specific use case docs and persona-tailored one-pagers."
        - title: "Sales Enablement"
          icon: "fas fa-users"
          questions:
            - question: "Can my entire sales team access and reuse the collateral?"
              answer: "Yes. Store all demo-generated collateral in Docsie's knowledge base where your sales team can search by feature, industry, competitor, or use case. Perfect for sales enablement and onboarding new AEs."
            - question: "Can we brand the collateral for client-facing delivery?"
              answer: "Absolutely. Add your logo, colors, and branding to all collateral. Export as PDFs for email, or share via white-labeled portals. Professional enough to send directly to prospects after discovery calls."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

