    faq_v2:
      badge: "Common Questions"
      title: "SAP Training Video to User Guide FAQ"
      description: "Everything you need to know about converting SAP training to guides and SOPs"
      faq_categories:
        - title: "SAP-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "What formats do you generate—user guides, SOPs, or training manuals?"
              answer: "All of them. From a single SAP training video, Docsie can generate step-by-step user guides, formal SOPs with business context, quick reference cards, training manuals, or knowledge base articles. You choose the format and tone that fits your needs."
            - question: "Does Docsie understand SAP transaction codes and create proper step-by-step instructions?"
              answer: "Yes. Docsie's AI recognizes SAP transaction codes (VA01, ME21N, FB60), menu paths, field names, and converts video narration into numbered step-by-step instructions with screenshots embedded at the right places—exactly what you need for user guides and SOPs."
            - question: "Can I create SAP SOPs for Fiori apps, not just SAP GUI?"
              answer: "Absolutely. Docsie works with SAP Fiori launchpad, custom Fiori apps, SAP GUI, web-based SAP applications, and mobile SAP apps. It captures app tiles, navigation steps, and creates user guides for any SAP interface."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate SAP user guides into our existing SharePoint or portal?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, Confluence, your intranet, or any website with a single line of code using our plugins and integrations. Your users get searchable, always-up-to-date guides without leaving their existing systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global SAP rollouts?"
              answer: "Absolutely. Record your SAP training once, and Docsie generates user guides and SOPs in 50+ languages. Perfect for global SAP implementations where you need guides in English, German, Spanish, Chinese, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential SAP training content?"
              answer: "Yes. All SAP training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO and advanced security features for sensitive SAP process documentation."

