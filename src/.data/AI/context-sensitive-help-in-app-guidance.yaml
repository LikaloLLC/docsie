    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about context-sensitive help"
      faq_categories:
        - title: "Implementation & Integration"
          icon: "fas fa-code"
          badge: "Most Popular"
          questions:
            - question: "How hard is it to implement context-sensitive help?"
              answer: "It's surprisingly simple. Add one line of JavaScript to your app, then tag your help content with context identifiers (like page IDs or UI element selectors). Docsie's AI handles the rest—automatically surfacing relevant help based on user context."
            - question: "Does this work with single-page applications (React, Vue, Angular)?"
              answer: "Yes. Docsie's help widget is built for modern JavaScript frameworks. It detects route changes, monitors DOM updates, and adapts to dynamic content—working seamlessly with React, Vue, Angular, and other SPAs."
            - question: "Can I customize how help content appears?"
              answer: "Absolutely. You control tooltip positioning, colors, fonts, animation timing, and interaction patterns. Choose from tooltips, slide-out panels, modals, or inline guidance—or create custom presentation styles."
        - title: "Content & Targeting"
          icon: "fas fa-bullseye"
          questions:
            - question: "How do I target help content to specific pages or features?"
              answer: "Use CSS selectors, page URLs, or custom data attributes to define context. For example, target help content to '#export-button' or 'page:/reports/export' and it automatically appears when users interact with those elements."
            - question: "Can help content change based on user behavior or role?"
              answer: "Yes. Docsie can show different help content based on user properties (role, subscription tier, feature access), behavioral patterns (new vs. experienced user), or current workflow state (step 2 of onboarding vs. daily usage)."
            - question: "How do I prevent help overload and tooltip fatigue?"
              answer: "Smart frequency controls limit how often tooltips appear. Track which help content users have seen, implement progressive disclosure (show advanced tips only after basics), and use analytics to identify and disable low-engagement tooltips."
        - title: "Analytics & Optimization"
          icon: "fas fa-chart-bar"
          questions:
            - question: "Can I see which help content users actually engage with?"
              answer: "Yes. Docsie tracks help content views, clicks, dismissals, and time spent. See which features generate most help requests, identify confusing UI elements, and optimize guidance based on actual usage patterns."
            - question: "How do I know if context-sensitive help is reducing support tickets?"
              answer: "Compare support ticket volume before and after implementation, filtered by topic. Most customers see 30-50% reduction in tickets for features with good in-app guidance. Docsie's analytics dashboard shows self-service success rates."
