    faq_v2:
      badge: "Common Questions"
      title: "Zoom Recordings to Documentation FAQ"
      description: "Everything you need to know about converting Zoom recordings"
      faq_categories:
        - title: "Zoom-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Can Docsie extract content from screen shares and PowerPoints shown during Zoom calls?"
              answer: "Yes. Docsie uses computer vision and OCR to read text from screen shares, PowerPoint presentations, Excel spreadsheets, and any content shown during Zoom calls—not just audio transcription. This includes code, diagrams, and data."
            - question: "Does this work with Zoom cloud recordings or downloaded MP4 files?"
              answer: "Both. Upload Zoom cloud recordings directly, or download the MP4 from Zoom and upload to Docsie. We support all Zoom recording formats including gallery view and speaker view."
            - question: "Can you capture Zoom chat messages and Q&A sessions?"
              answer: "Yes. Docsie extracts Zoom chat messages, Q&A sessions, and participant questions discussed during calls. These become FAQ sections or discussion summaries in your documentation."
        - title: "Output & Delivery"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I deliver this as white-labeled client documentation?"
              answer: "Absolutely. Docsie generates branded client portals with your logo, colors, and custom domain. Clients access training documentation through your branded portal with SSO if needed."
            - question: "Can I translate Zoom recordings for global clients?"
              answer: "Yes. Record your Zoom call once, and Docsie generates training documentation in 50+ languages. Perfect for global implementations where you need guides in English, Spanish, German, French, etc."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

