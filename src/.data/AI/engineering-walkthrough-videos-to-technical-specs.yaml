    faq_v2:
      badge: "Common Questions"
      title: "Engineering Documentation FAQ"
      description: "Everything you need to know about converting walkthroughs to technical specs"
      faq_categories:
        - title: "Technical Content Extraction"
          icon: "fas fa-code"
          badge: "Most Popular"
          questions:
            - question: "Can Docsie extract whiteboard diagrams and architecture drawings from videos?"
              answer: "Yes. Docsie's computer vision reads whiteboard content, Miro boards, Lucidchart diagrams, and hand-drawn architecture sketches shown during walkthroughs. It identifies system components, data flows, and relationships—then structures them as documentation with the diagrams embedded."
            - question: "Does it recognize code in IDE walkthroughs and Jupyter notebooks?"
              answer: "Absolutely. Docsie detects code shown in VS Code, IntelliJ, Jupyter notebooks, or terminal sessions. It preserves syntax highlighting, identifies the programming language, and formats code blocks properly in the documentation. Perfect for code review walkthroughs and technical demos."
            - question: "Can it extract API specifications from Postman or Swagger demos?"
              answer: "Yes. When engineers demonstrate API endpoints in Postman, Swagger, or Insomnia during walkthroughs, Docsie captures the HTTP methods, URLs, request bodies, and response examples. It structures them as API reference documentation."
        - title: "Architecture & Design Docs"
          icon: "fas fa-project-diagram"
          questions:
            - question: "Can you generate Architecture Decision Records (ADRs) from design review videos?"
              answer: "Yes. Docsie identifies design decisions discussed during architecture reviews—the problem, options considered, decision made, and consequences. It formats them as ADRs linked to specific timestamps in the walkthrough video for future reference."
            - question: "Does this work for microservices architecture and distributed system walkthroughs?"
              answer: "Absolutely. Docsie understands complex system architectures—microservices, event-driven systems, distributed databases. It documents service boundaries, communication patterns (REST, gRPC, message queues), and data consistency models discussed in walkthroughs."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

