    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting healthcare training to HIPAA-compliant documentation"
      faq_categories:
        - title: "HIPAA & Joint Commission Compliance"
          icon: "fas fa-user-shield"
          badge: "Most Popular"
          questions:
            - question: "Does this meet HIPAA requirements for written privacy policies and procedures?"
              answer: "Yes. Docsie converts HIPAA training videos into written privacy policies and security procedures that meet HIPAA Privacy Rule (45 CFR 164.530) and Security Rule (45 CFR 164.316) documentation requirements. The system includes audit trails, version control, and timestamps for all policy changes."
            - question: "Can I use this for Joint Commission survey preparation?"
              answer: "Absolutely. Docsie generates documentation that demonstrates compliance with Joint Commission standards including patient safety goals, infection control protocols, and staff competency requirements. The system structures clinical procedures in a format suitable for Joint Commission surveyors and includes evidence of staff training completion."
            - question: "How does this help with CMS conditions of participation compliance?"
              answer: "Docsie converts CMS training videos into documented policies and procedures that meet Medicare conditions of participation. The AI automatically identifies regulatory requirements, patient safety measures, and quality improvement protocols required by CMS for hospital and clinic certification."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand healthcare and clinical terminology?"
              answer: "Yes. Our multimodal AI is trained on healthcare and medical content. It recognizes HIPAA terminology, clinical procedures, patient safety protocols, infection control measures, and healthcare compliance concepts—ensuring accurate documentation that doesn't misinterpret critical patient safety or regulatory requirements."
            - question: "Can I customize the documentation for our hospital policy manual?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit to match your hospital's policy format and numbering system. All clinical procedures, patient safety measures, and compliance requirements can be customized while maintaining documentation integrity for regulatory surveys."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

