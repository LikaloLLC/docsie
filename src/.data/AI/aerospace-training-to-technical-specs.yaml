    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting aerospace training to AS9100-compliant documentation"
      faq_categories:
        - title: "AS9100 & FAA Compliance"
          icon: "fas fa-plane"
          badge: "Most Popular"
          questions:
            - question: "Does this meet AS9100 requirements for documented work instructions and procedures?"
              answer: "Yes. Docsie converts aerospace training videos into work instructions and technical procedures that meet AS9100 quality management requirements. The system structures assembly steps, inspection points, torque specifications, and material callouts in formats suitable for aerospace quality audits and customer source inspections."
            - question: "Can I use this for FAA airworthiness documentation and MRO procedures?"
              answer: "Absolutely. Docsie generates documented maintenance and assembly procedures that support FAA airworthiness requirements. The system converts training videos into technical procedures that demonstrate compliance with FARs (Federal Aviation Regulations) and meet OEM technical manual standards for MRO facilities."
            - question: "How does this help with NADCAP special process and first article documentation?"
              answer: "Docsie converts special process training and first article procedures into documented work instructions that support NADCAP audit requirements. The AI automatically identifies special process parameters, inspection criteria, and configuration control requirements that need to be documented for heat treat, NDT, welding, and coating processes."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand aerospace terminology and technical specifications?"
              answer: "Yes. Our multimodal AI is trained on aerospace manufacturing and MRO content. It recognizes AS9100 terminology, FAA regulations, torque specifications, material callouts, inspection criteria, and special process requirements—ensuring accurate documentation that doesn't misinterpret critical technical or airworthiness requirements."
            - question: "Can I customize the documentation for prime contractor and customer requirements?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit to match specific prime contractor requirements (Boeing, Airbus, Lockheed, etc.) and your facility's work instruction format. All technical specifications, inspection points, and assembly procedures can be customized while maintaining AS9100 compliance structure."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

