    faq_v2:
      badge: "Common Questions"
      title: "SharePoint Training Documentation FAQs"
      categories:
        - title: "SharePoint Training Conversion"
          questions:
            - question: "Can you convert SharePoint Online and SharePoint Server training?"
              answer: "Yes, we support both SharePoint Online (Microsoft 365) and SharePoint Server on-premises training. The AI recognizes platform-specific features and generates documentation accordingly."

            - question: "Does it work with Microsoft Teams recordings of SharePoint training?"
              answer: "Absolutely. Upload Teams meeting recordings of SharePoint training sessions and we'll convert them to searchable documentation—perfect for implementation partners who train clients via Teams."

            - question: "Can you separate end-user guides from admin documentation?"
              answer: "Yes, the AI can generate role-specific documentation from the same training video—creating simple guides for end users and detailed technical documentation for SharePoint admins."

            - question: "What about SharePoint governance and permissions training?"
              answer: "We specialize in converting complex governance, permissions, and security training into clear step-by-step guides that teams can reference when configuring sites and setting permissions."

        - title: "Technical Details"
          questions:
            - question: "Can you document custom SharePoint solutions and workflows?"
              answer: "Yes, we can document custom SharePoint Framework (SPFx) solutions, custom workflows, Power Automate integrations, and third-party add-ons demonstrated in your training videos."

            - question: "Does it capture SharePoint screenshots and UI elements?"
              answer: "Yes, the AI extracts screenshots from your training videos and includes them in documentation at the relevant steps—showing exactly which buttons to click and where to find features."

            - question: "Can you generate documentation in multiple languages?"
              answer: "Absolutely. Perfect for global SharePoint rollouts—train in English, generate documentation in Spanish, French, German, and 20+ other languages simultaneously."

            - question: "How do you handle SharePoint version differences?"
              answer: "The AI identifies which SharePoint version is being trained (Online vs. Server 2019/2016) and generates documentation with version-specific instructions and screenshots."
