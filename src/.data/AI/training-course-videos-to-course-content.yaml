    faq_v2:
      badge: "Common Questions"
      title: "Training Course Documentation FAQs"
      categories:
        - title: "Course Content Creation"
          questions:
            - question: "Can you convert live instructor-led training to course materials?"
              answer: "Yes, record your live training sessions and we'll convert them to structured course content including course outlines, learning objectives, student guides, and instructor materials."

            - question: "Does it work with webinar recordings and online courses?"
              answer: "Absolutely. Upload webinar recordings, Zoom courses, Teams training sessions, or any video-based training content and we'll generate comprehensive course materials."

            - question: "Can you create different materials for students vs. instructors?"
              answer: "Yes, the AI generates role-specific materials—simplified student guides with learning objectives and key concepts, plus detailed instructor manuals with teaching notes and assessment guidance."

            - question: "What about certification and compliance training courses?"
              answer: "We specialize in converting certification training, compliance courses, and regulatory training into structured documentation with learning objectives, assessment criteria, and audit trails."

        - title: "Technical Integration"
          questions:
            - question: "Can you export to learning management systems?"
              answer: "Yes, we support SCORM, xAPI (Tin Can), and other LMS standards. Course content exports ready to upload to Canvas, Moodle, Blackboard, Cornerstone, and other platforms."

            - question: "Does it capture diagrams, charts, and visual aids from videos?"
              answer: "Yes, the AI extracts slides, diagrams, charts, and visual aids from course videos and includes them in course materials at the appropriate learning modules."

            - question: "Can you generate assessments and quiz questions?"
              answer: "Absolutely. The AI identifies key concepts and generates multiple-choice questions, true/false items, and short-answer prompts aligned to learning objectives."

            - question: "How do you handle multi-session courses and curricula?"
              answer: "We process entire course series, maintaining continuity across sessions and building comprehensive curricula with prerequisite tracking, module dependencies, and learning pathways."
