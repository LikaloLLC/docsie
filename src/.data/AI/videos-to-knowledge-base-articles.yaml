    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting videos to KB articles"
      faq_categories:
        - title: "KB Organization & Structure"
          icon: "fas fa-layer-group"
          badge: "Most Popular"
          questions:
            - question: "Does the AI automatically organize videos into KB categories?"
              answer: "Yes. Docsie's AI analyzes the topic and content of each video and automatically assigns it to relevant categories. It creates a logical knowledge base structure organized by topic, making it easy for users to browse and find information."
            - question: "Can one video create multiple KB articles?"
              answer: "Absolutely. Long webinars or training videos are automatically split into multiple focused KB articles by topic. A 60-minute webinar might become 8-10 separate articles, each covering a specific feature or question—making knowledge more discoverable."
            - question: "How does FAQ generation work?"
              answer: "The AI identifies question-and-answer patterns in your videos and automatically extracts them into FAQ format. It recognizes when presenters answer audience questions, explain common issues, or address typical user problems."
        - title: "Search & Discoverability"
          icon: "fas fa-search"
          questions:
            - question: "How does this improve self-service and reduce support tickets?"
              answer: "KB articles are searchable by keyword, making answers instantly findable. Users type their question, find the exact article, and self-serve—instead of opening support tickets or watching entire videos hoping to find the answer."
            - question: "Can I customize how articles are organized and tagged?"
              answer: "Yes. The AI-generated categories and tags serve as a starting point that you can customize to match your KB structure. You can reorganize articles, create custom categories, and adjust tags to fit your knowledge base taxonomy."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

