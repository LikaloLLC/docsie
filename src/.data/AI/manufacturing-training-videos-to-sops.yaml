    faq_v2:
      badge: "Common Questions"
      title: "Manufacturing Documentation FAQ"
      description: "Everything you need to know about converting training videos to SOPs"
      faq_categories:
        - title: "ISO Compliance"
          icon: "fas fa-certificate"
          badge: "Most Popular"
          questions:
            - question: "Does the documentation meet ISO 9001 and AS9100 requirements?"
              answer: "Yes. Docsie generates SOPs with all required elements for ISO compliance—title blocks, document control numbers, revision history, approval workflows, and change management. The format matches what quality auditors expect to see during certification audits."
            - question: "Can we use this for FDA-regulated manufacturing documentation?"
              answer: "Yes. Docsie supports audit trails and version control that help meet FDA documentation requirements. The documentation includes timestamp records showing who created and reviewed each SOP—useful for pharmaceutical and medical device manufacturing quality systems."
            - question: "How do you handle document version control for SOPs?"
              answer: "Every SOP includes automatic revision tracking. When you update a training video and regenerate the SOP, Docsie creates a new revision with change history. You can see exactly what changed between versions and maintain an audit trail for ISO compliance."
        - title: "Visual Work Instructions"
          icon: "fas fa-images"
          questions:
            - question: "Can you extract assembly sequences and tool requirements from videos?"
              answer: "Yes. Docsie's computer vision identifies tools, parts, and assembly steps shown in training videos. It captures key frames showing hand positions, tool usage, and part orientation—then annotates them as visual work instructions. Perfect for complex assemblies where written instructions aren't enough."
            - question: "Does it work with overhead camera angles and close-up shots?"
              answer: "Absolutely. Our AI handles all camera angles—overhead shots of workbenches, close-ups of assembly details, wide shots of equipment operation, and first-person POV videos. It understands manufacturing context and extracts the right visual moments for work instructions."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

