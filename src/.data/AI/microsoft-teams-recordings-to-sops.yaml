    faq_v2:
      badge: "Common Questions"
      title: "Teams Recordings to Documentation FAQ"
      description: "Everything you need to know about converting Teams recordings to SOPs"
      faq_categories:
        - title: "Teams-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Can Docsie read PowerPoint slides and shared screens from Teams recordings?"
              answer: "Yes. Docsie uses computer vision and OCR to read text from PowerPoint presentations, Excel spreadsheets, whiteboard sessions, and any content shared during Teams calls—not just audio transcription."
            - question: "Does this work with Teams recordings stored in SharePoint, Stream, or OneDrive?"
              answer: "Yes. Upload recordings from Teams Stream, SharePoint libraries, OneDrive folders, or download from Teams cloud storage. Docsie works with all Teams recording storage locations."
            - question: "Can I publish the documentation back to SharePoint or OneDrive?"
              answer: "Absolutely. Docsie integrates with SharePoint and OneDrive, so you can publish documentation directly to SharePoint sites or OneDrive folders where your team can search and access it."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "What formats do you generate—SOPs, meeting summaries, or decision logs?"
              answer: "All of them. From a single Teams recording, Docsie can generate formatted SOPs, executive meeting summaries, decision logs with action items, or knowledge base articles. You choose the format that fits your needs."
            - question: "Can I integrate this with Microsoft 365 and make it searchable across our organization?"
              answer: "Yes. Publish documentation to SharePoint or OneDrive where it becomes searchable by your entire organization within Microsoft 365. Docsie also supports embedding documentation into SharePoint sites with our web part integration."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential Teams meeting recordings?"
              answer: "Yes. All Teams recordings are encrypted in transit and at rest. We never share your content. You can delete recordings anytime. Enterprise plans include SSO, advanced security features, and compliance certifications (SOC 2, GDPR)."

