- id: tacit-knowledge-capture
  category: Solutions
  title: Tacit Knowledge Capture Platform - Turn Expertise into Documentation
  description: Capture undocumented expertise and tribal knowledge from your team. AI-powered knowledge extraction from meetings, conversations, and expert interviews. Transform tacit knowledge into searchable documentation.
  ui_version: v3

  components:
    # HERO - Main page header (will use hero_v2 template due to ui_version: v2)
    hero:
      badge: "New Feature"
      title: "Capture Tacit Knowledge Before It Walks Out The Door"
      description: "Transform your team's undocumented expertise into searchable documentation automatically. Stop losing critical knowledge when employees leave."
      image: "/assets/solutions/tacit-knowledge-hero.jpg"
      cta:
        text: "Book Demo"
        url: "#"
      secondary_cta:
        text: "Watch Video"
        url: "/demo/"

    # STATS - Animated statistics (will use stats_v2 or modern_stats_v2)
    stats:
      title: "The Impact of Knowledge Loss"
      stats:
        - number: 60
          suffix: "%"
          label: "Faster Documentation"
          description: "Reduce time spent on documentation tasks"
          icon: "growth"
        - number: 98
          suffix: "%"
          label: "Customer Satisfaction"
          description: "Users love our platform and features"
          icon: "award"
        - number: 24
          suffix: "/7"
          label: "Global Support"
          description: "Round-the-clock assistance worldwide"
          icon: "clock"

    # FEATURES - Feature grid (will use features_v2 template)
    features:
      badge: "Core Features"
      title: "Everything You Need to Capture Expertise"
      description: "Comprehensive tools to extract, organize, and preserve institutional knowledge"
      features_list:
        - icon: "document"
          title: "Automatic Knowledge Extraction"
          description: "AI automatically identifies and extracts key insights from meetings, interviews, and documentation"
        - icon: "users"
          title: "Expert Interview System"
          description: "Guided templates to systematically capture knowledge from subject matter experts"
        - icon: "search"
          title: "Intelligent Search"
          description: "Find any piece of knowledge instantly with AI-powered semantic search"
        - icon: "chart"
          title: "Knowledge Gap Analysis"
          description: "Identify undocumented processes and critical knowledge at risk"
        - icon: "lightning"
          title: "Real-time Capture"
          description: "Record and transcribe meetings automatically with key insights highlighted"
        - icon: "shield"
          title: "Secure Knowledge Vault"
          description: "Enterprise-grade security to protect your most valuable intellectual property"

    # CAROUSEL - Image slideshow (will use carousel_v2 template)
    carousel:
      title: "Tacit Knowledge Capture in Action"
      description: "See how leading companies preserve institutional knowledge"
      carousel_slides:
        - image: "/assets/solutions/tacit-case1.jpg"
          alt: "Retiring Engineers"
          caption: "Capture decades of engineering expertise before retirement"
        - image: "/assets/solutions/tacit-case2.jpg"
          alt: "Process Documentation"
          caption: "Document complex processes that exist only in experts' heads"
        - image: "/assets/solutions/tacit-case3.jpg"
          alt: "Training Materials"
          caption: "Convert expert knowledge into comprehensive training materials"

    # COMPARISON - Traditional vs Modern (will use comparison_v2 template)
    comparison:
      title: "Traditional vs AI-Powered Knowledge Capture"
      description: "See the difference modern technology makes"
      comparisons_list:
        - traditional:
            title: "Traditional Knowledge Transfer"
            points:
              - "Manual documentation takes months"
              - "Knowledge lost when employees leave"
              - "Inconsistent documentation quality"
              - "No way to find undocumented processes"
              - "Tribal knowledge stays in people's heads"
          modern:
            title: "AI-Powered Tacit Knowledge Capture"
            points:
              - "Automatic extraction from meetings and conversations"
              - "Proactive knowledge preservation before turnover"
              - "AI ensures consistent, high-quality documentation"
              - "Intelligent gap analysis identifies missing knowledge"
              - "Systematic capture with guided expert interviews"

    # BENEFITS - Benefits section (will use benefits_v2 template)
    benefits:
      badge: "Key Benefits"
      title: "Why Companies Choose Docsie for Knowledge Capture"
      description: "Transform how you preserve and share institutional knowledge"
      benefit_list:
        - icon: "fas fa-shield-alt"
          title: "Prevent Knowledge Loss"
          description: "Never lose critical expertise when employees retire or leave"
        - icon: "fas fa-clock"
          title: "Save Time"
          description: "Reduce knowledge transfer time by 70% with automated capture"
        - icon: "fas fa-users-cog"
          title: "Scale Expertise"
          description: "Make expert knowledge accessible to the entire organization"
        - icon: "fas fa-chart-line"
          title: "Competitive Advantage"
          description: "Preserve intellectual property and maintain business continuity"

    # FAQ_V2 - FAQ section (template explicitly checks for faq_v2)
    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about tacit knowledge capture"
      faq_categories:
        - title: "Getting Started"
          icon: "fas fa-rocket"
          badge: "Most Popular"
          questions:
            - question: "How quickly can we start capturing knowledge?"
              answer: "You can begin capturing knowledge immediately. Our guided setup takes less than 30 minutes, and you can start recording expert interviews or meetings right away."
            - question: "What types of knowledge can be captured?"
              answer: "We capture all forms of tacit knowledge including process expertise, troubleshooting skills, decision-making criteria, customer insights, technical know-how, and institutional memory."
            - question: "Do experts need technical skills to participate?"
              answer: "No technical skills required. Our intuitive interface and guided templates make it easy for anyone to share their expertise through interviews, screen recordings, or meeting participation."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "How secure is our knowledge data?"
              answer: "Enterprise-grade security with AES-256 encryption, SOC 2 compliance, role-based access controls, and on-premise deployment options for regulated industries."
            - question: "Can we control who accesses specific knowledge?"
              answer: "Yes, granular permissions let you control access by team, department, or individual. You can also mark knowledge as confidential or restricted."
            - question: "Is the platform GDPR compliant?"
              answer: "Fully GDPR compliant with data residency options, right to deletion, data export capabilities, and comprehensive audit trails."
      cta:
        text: "Schedule Expert Consultation"
        url: "/demo/"
        pretext: "Have more questions?"

    # TESTIMONIALS - Customer testimonials (template checks for 'testimonials' and renders testimonials_v2)
    testimonials:
      badge: "Customer Success"
      title: "Trusted by Leading Organizations"
      description: "See what our customers say about preserving institutional knowledge"
      testimonials:
        - name: "Sarah Mitchell"
          role: "VP of Operations"
          company: "Manufacturing Corp"
          avatar: "/assets/testimonials/sarah.jpg"
          rating: 5
          text: "We captured 30 years of manufacturing expertise from our retiring engineers. This knowledge would have been lost forever."
        - name: "James Chen"
          role: "CTO"
          company: "Tech Innovations Inc"
          avatar: "/assets/testimonials/james.jpg"
          rating: 5
          text: "The AI interview system guided us through extracting critical system architecture knowledge. Saved us from a disaster."
        - name: "Maria Rodriguez"
          role: "Learning & Development Director"
          company: "Financial Services Group"
          avatar: "/assets/testimonials/maria.jpg"
          rating: 5
          text: "Transformed how we onboard new employees. What took 6 months now takes 2 weeks with access to expert knowledge."
        - name: "David Park"
          role: "Quality Manager"
          company: "Aerospace Engineering"
          avatar: "/assets/testimonials/david.jpg"
          rating: 5
          text: "Gap analysis revealed 40% of our critical processes were undocumented. Now we have comprehensive knowledge coverage."

    # GALLERY - Image gallery (will use gallery_v2 template)
    gallery:
      title: "Knowledge Capture in Every Industry"
      description: "From manufacturing to healthcare, preserve critical expertise"
      gallery_images:
        - image: "/assets/gallery/manufacturing.jpg"
          alt: "Manufacturing Knowledge"
          caption: "Capture decades of production expertise"
        - image: "/assets/gallery/healthcare.jpg"
          alt: "Healthcare Procedures"
          caption: "Document complex medical procedures"
        - image: "/assets/gallery/engineering.jpg"
          alt: "Engineering Systems"
          caption: "Preserve system architecture knowledge"
        - image: "/assets/gallery/finance.jpg"
          alt: "Financial Processes"
          caption: "Capture institutional trading knowledge"

    # CTA_SECTION - Call to action (will default to cta_section template, which may be v2)
    cta_section:
      badge: "Get Started Today"
      title: "Don't Let Critical Knowledge Walk Out The Door"
      description: "Join hundreds of companies preserving their most valuable asset - institutional knowledge"
      primary_button:
        text: "Book a Demo"
        url: "/demo/"
      secondary_button:
        text: "Start Free Trial"
        url: "https://app.docsie.io/onboarding/"
      note: "No credit card required • 14-day free trial • Setup in under 30 minutes"
      trust_indicators:
        - text: "SOC 2 Certified"
          icon: true
        - text: "GDPR Compliant"
          icon: true
        - text: "24/7 Support"
          icon: true

    # RELATED_AUTO - Related solutions (will auto-fetch hero images and descriptions from target pages)
    related_auto:
      title: "Related Solutions"
      solutions:
        - url: "/solutions/documentation-from-video/"
        - url: "/solutions/knowledge-base/"
        - url: "/solutions/ai-technical-writer/"
