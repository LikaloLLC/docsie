          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Does Docsie document custom ServiceNow workflows and service catalogs?"
              answer: "Yes. Docsie's AI recognizes custom workflows, service catalog items, business rules, Flow Designer automations, approval chains, and UI policies. It creates comprehensive configuration documentation showing how customizations work and flow through the system."
            - question: "Can I document both ITSM and ITOM in one guide?"
              answer: "Absolutely. Docsie documents the complete ServiceNow implementation—ITSM processes, ITOM operations, CMDB configuration, custom workflows, service catalogs, and integrations—in a single comprehensive client handover package."
            - question: "Does it work for ServiceNow ITSM, ITOM, ITBM, and custom applications?"
              answer: "Yes. Docsie works with all ServiceNow modules including ITSM, ITOM, ITBM, CSM, HR Service Delivery, custom applications, and scoped apps. It captures module-specific workflows and creates tailored configuration documentation."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate documentation into our existing client portals or SharePoint?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, client portals, your intranet, or any website with a single line of code using our plugins and integrations. Clients get searchable, always-up-to-date guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global ServiceNow deployments?"
              answer: "Absolutely. Record your ServiceNow training once, and Docsie generates client documentation in 50+ languages. Perfect for multinational implementations where clients need guides in English, Spanish, French, German, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential ServiceNow implementations?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, white-labeling, and advanced security features for confidential client configuration documentation."

