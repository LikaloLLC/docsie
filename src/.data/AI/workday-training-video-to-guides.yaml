    faq_v2:
      badge: "Common Questions"
      title: "Workday Training Video to Portal FAQ"
      description: "Everything you need to know about converting Workday training to branded client portals"
      faq_categories:
        - title: "Workday-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "What is a branded client portal and why is it important for Workday?"
              answer: "A branded client portal is a white-labeled documentation site with your company's logo, colors, and custom domain that clients access via SSO. For Workday implementations, this means your clients get a professional, branded experience for all their training materials and user guides—making handover seamless and reinforcing your brand."
            - question: "Does Docsie understand Workday tasks and business processes?"
              answer: "Yes. Docsie's AI recognizes Workday task navigation, business processes, field names, and converts video narration into numbered step-by-step instructions with screenshots embedded at the right places—exactly what you need for user guides and SOPs tailored to your client's tenant configuration."
            - question: "Can I create Workday guides for HCM, Financial Management, and custom configurations?"
              answer: "Absolutely. Docsie works with Workday HCM, Financial Management, Payroll, Recruiting, custom calculated fields, and tenant-specific configurations. It captures task navigation, business process steps, and creates user guides for any Workday module."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate Workday user guides into our existing SharePoint or portal?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, Confluence, your intranet, or any website with a single line of code using our plugins and integrations. Your users get searchable, always-up-to-date guides without leaving their existing systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global Workday rollouts?"
              answer: "Absolutely. Record your Workday training once, and Docsie generates user guides and branded portals in 50+ languages. Perfect for global Workday implementations where you need guides in English, Spanish, French, German, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential Workday training content?"
              answer: "Yes. All Workday training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, custom domains, and advanced security features for sensitive Workday process documentation."

