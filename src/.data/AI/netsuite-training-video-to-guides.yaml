      title: "NetSuite Training to Client Documentation FAQ"
      description: "Everything you need to know about creating professional NetSuite client documentation"
      faq_categories:
        - title: "NetSuite-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Does Docsie document custom SuiteScripts and NetSuite customizations?"
              answer: "Yes. Docsie's AI recognizes custom SuiteScripts (Client Scripts, User Event Scripts, Scheduled Scripts), workflows, custom records, custom fields, saved searches, and NetSuite customizations. It creates comprehensive client documentation showing how customizations work and integrate with standard NetSuite features."
            - question: "Can I document both NetSuite ERP and CRM in one client handover package?"
              answer: "Absolutely. Docsie documents the complete NetSuite implementation—ERP modules (Financials, Inventory, Order Management), CRM (Sales, Marketing, Support), SuiteCommerce, and all customizations—in a single comprehensive client handover package."
            - question: "Does it work for NetSuite OneWorld and multi-subsidiary implementations?"
              answer: "Yes. Docsie works with NetSuite OneWorld, multi-subsidiary implementations, multi-currency, and advanced NetSuite configurations. It creates documentation covering subsidiary-specific customizations and global NetSuite processes."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate NetSuite documentation into client portals or systems?"
              answer: "Yes. Docsie lets you embed live documentation directly into client portals, SharePoint, their intranet, or any website with a single line of code using our plugins and integrations. Clients get searchable, always-up-to-date NetSuite guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support creating documentation for multiple NetSuite clients at once?"
              answer: "Absolutely. Docsie is built for NetSuite partners managing multiple client implementations. You can create separate documentation workspaces for each client, customize branding per client, and efficiently scale your client documentation process across your entire NetSuite practice."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential client NetSuite implementations?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, white-labeling, and client-specific workspaces for confidential implementation documentation."

