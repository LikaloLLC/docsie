    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting insurance training to state-compliant documentation"
      faq_categories:
        - title: "State Compliance & CE Requirements"
          icon: "fas fa-certificate"
          badge: "Most Popular"
          questions:
            - question: "Does this meet state insurance department continuing education documentation requirements?"
              answer: "Yes. Docsie converts agent training videos into written documentation that demonstrates CE compliance and training completion. The system includes timestamps, training records, and version control that state insurance departments expect to see during market conduct examinations. Documentation is structured to support state CE credit requirements."
            - question: "Can I use this to prepare for state market conduct exams?"
              answer: "Absolutely. Docsie generates documented underwriting guidelines, sales procedures, and claims handling protocols that state examiners require. The system structures agent training into written procedures that demonstrate compliance with state insurance regulations and unfair trade practice laws."
            - question: "How does this help with E&O carrier documentation requirements?"
              answer: "Docsie converts agent training videos into documented evidence of procedural compliance and training completion. E&O carriers require proof that agents followed proper procedures—written documentation provides this evidence better than video-only training. The system creates searchable procedures that demonstrate agents were trained on proper sales practices, underwriting guidelines, and claims handling."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand insurance terminology and underwriting concepts?"
              answer: "Yes. Our multimodal AI is trained on insurance and regulatory content. It recognizes underwriting terminology, state insurance requirements, coverage concepts, rating procedures, and claims handling protocols—ensuring accurate documentation that doesn't misinterpret critical insurance concepts or regulatory requirements."
            - question: "Can I organize the documentation by line of business or coverage type?"
              answer: "Yes. The AI-generated documentation can be organized to match your lines of business, coverage types, and state jurisdictions. All underwriting guidelines, sales procedures, and claims handling protocols can be categorized for your specific product portfolio and state licensing."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

