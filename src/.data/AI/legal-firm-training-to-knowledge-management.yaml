    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting legal training to firm knowledge management"
      faq_categories:
        - title: "Legal Knowledge Management"
          icon: "fas fa-gavel"
          badge: "Most Popular"
          questions:
            - question: "How does this preserve institutional knowledge when senior partners retire?"
              answer: "Docsie converts partner training videos into searchable, citeable documentation organized by practice area and legal issue. Associates can search for specific case strategies, legal arguments, and procedural tactics instead of watching hours of video. This transforms partner expertise into permanent firm knowledge that survives partner transitions."
            - question: "Can associates search for specific legal issues or case strategies?"
              answer: "Yes. The documentation is fully searchable by legal issue, practice area, jurisdiction, case type, and procedural tactics. Associates can find specific guidance on discovery strategies, motion practice, settlement tactics, or legal arguments without watching entire training videos."
            - question: "How does this help with associate training and onboarding?"
              answer: "New associates can reference written documentation instead of watching 40+ hours of training videos. They retain 70% more information with searchable written materials compared to video-only training. Associates can cite specific procedures in their work and find guidance on demand rather than trying to remember video content."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand legal terminology and case citations?"
              answer: "Yes. Our multimodal AI is trained on legal content and recognizes case citations, statutes, legal precedents, procedural terminology, and practice area jargon. It automatically identifies and links legal citations, preserving the integrity of legal arguments and research strategies."
            - question: "Can I organize the knowledge base by our firm's practice areas?"
              answer: "Yes. The AI-generated documentation can be organized to match your firm's practice areas, office locations, and matter types. All case strategies, legal arguments, and procedures can be categorized and tagged for your firm's specific knowledge management structure."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

