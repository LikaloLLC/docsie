    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about workshop-to-training-materials conversion"
      faq_categories:
        - title: "How It Works"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Can you process multi-day workshop recordings?"
              answer: "Yes! You can upload multiple video files from multi-day workshops and we'll process them into a cohesive training program with day-based modules or topic-based organization."
            - question: "Does it work with hybrid workshops (in-person + virtual)?"
              answer: "Absolutely! Whether it's a Zoom recording, in-person camera recording, or hybrid event with multiple camera angles, we process all formats and create unified training materials."
            - question: "Can it identify group exercises and breakout sessions?"
              answer: "Yes! The AI recognizes when you're introducing exercises, breakout sessions, or group activities and captures them as structured learning activities with instructions and timestamps."
        - title: "Quality & Accuracy"
          icon: "fas fa-check-circle"
          questions:
            - question: "How does it handle whiteboard content and visual aids?"
              answer: "Our computer vision AI reads whiteboards, flip charts, slides, and other visual aids. It captures text, diagrams, and frameworks to include in the training materials."
            - question: "Can I customize the generated training materials?"
              answer: "Absolutely! The AI-generated materials serve as a solid first draft that you can edit, reorganize, and enhance using Docsie's built-in editor. Add additional exercises, update examples, or restructure modules as needed."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

