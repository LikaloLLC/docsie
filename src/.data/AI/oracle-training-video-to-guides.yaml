    faq_v2:
      badge: "Common Questions"
      title: "Oracle Training Video to User Guide FAQ"
      description: "Everything you need to know about converting Oracle training to guides and SOPs"
      faq_categories:
        - title: "Oracle-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "What formats do you generate—user guides, SOPs, or training manuals?"
              answer: "All of them. From a single Oracle training video, Docsie can generate step-by-step user guides, formal SOPs with business context, quick reference cards, training manuals, or knowledge base articles. You choose the format and tone that fits your needs."
            - question: "Does Docsie understand Oracle navigation paths and create proper step-by-step instructions?"
              answer: "Yes. Docsie's AI recognizes Oracle navigation paths, menu structures, field names, and converts video narration into numbered step-by-step instructions with screenshots embedded at the right places—exactly what you need for user guides and SOPs."
            - question: "Can I create Oracle SOPs for Fusion Cloud Apps, not just Oracle EBS?"
              answer: "Absolutely. Docsie works with Oracle Fusion Cloud Applications, Oracle ERP Cloud, Oracle EBS, Oracle NetSuite, and custom Oracle applications. It captures navigation, menu paths, and creates user guides for any Oracle interface."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate Oracle user guides into our existing SharePoint or portal?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, Confluence, your intranet, or any website with a single line of code using our plugins and integrations. Your users get searchable, always-up-to-date guides without leaving their existing systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global Oracle rollouts?"
              answer: "Absolutely. Record your Oracle training once, and Docsie generates user guides and SOPs in 50+ languages. Perfect for global Oracle implementations where you need guides in English, Spanish, Chinese, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential Oracle training content?"
              answer: "Yes. All Oracle training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO and advanced security features for sensitive Oracle process documentation."

