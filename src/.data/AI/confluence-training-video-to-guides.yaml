      title: "Confluence Training to Documentation Portal FAQ"
      description: "Everything you need to know about creating Confluence documentation portals"
      faq_categories:
        - title: "Confluence-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Does Docsie organize Confluence documentation by space and use case?"
              answer: "Yes. Docsie automatically organizes Confluence documentation by spaces (team spaces, knowledge bases, project spaces), features (pages, macros, templates), and use cases (collaboration, documentation, knowledge management). This creates intuitive documentation portals that teams can easily navigate."
            - question: "Can I document Confluence best practices and governance?"
              answer: "Absolutely. Docsie creates comprehensive best practices documentation covering Confluence space governance, permissions management, content organization standards, page template libraries, and team collaboration guidelines. Perfect for ensuring consistent Confluence usage across your organization."
            - question: "Does it work for both Confluence Cloud and Data Center?"
              answer: "Yes. Docsie works with Confluence Cloud, Confluence Data Center (self-hosted), and Confluence Server. It captures version-specific features and creates documentation tailored to your Confluence deployment."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate Confluence documentation into our existing systems?"
              answer: "Yes. Docsie lets you embed live documentation directly into your Confluence instance, SharePoint, intranet, or any website with a single line of code using our plugins and integrations. Teams get searchable, always-up-to-date Confluence guides without leaving their work environment. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global Confluence deployments?"
              answer: "Absolutely. Record your Confluence training once, and Docsie generates documentation portals in 50+ languages. Perfect for multinational organizations where teams need Confluence guides in English, Spanish, French, German, Japanese, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for internal Confluence training content?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, integration with Atlassian Cloud, and advanced security features for internal documentation."

