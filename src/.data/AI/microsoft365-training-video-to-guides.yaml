    faq_v2:
      badge: "Common Questions"
      title: "Microsoft 365 Training to Knowledge Base FAQ"
      description: "Everything you need to know about building M365 knowledge bases"
      faq_categories:
        - title: "Microsoft 365-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "What Microsoft 365 apps and features does Docsie document?"
              answer: "Docsie documents all Microsoft 365 apps including Teams (channels, meetings, calls), SharePoint (sites, document libraries, workflows), OneDrive, Power Platform (Power Apps, Power Automate, Power BI), Office apps (Word, Excel, PowerPoint, Outlook), Exchange, and Viva. It creates organized knowledge base articles for each app and feature."
            - question: "How does the search functionality work in the knowledge base?"
              answer: "Docsie provides full-text search across all Microsoft 365 knowledge base articles. Employees can search by feature name, keyword, app name, or question (e.g., 'how do I share a Teams channel with external users') and instantly find relevant articles with step-by-step instructions and screenshots."
            - question: "Can I organize the knowledge base by department or role?"
              answer: "Yes. While Docsie automatically organizes content by Microsoft 365 app and feature, you can also create custom categories and tags to organize by department (HR, Finance, IT), role (manager, employee, admin), or any other taxonomy that fits your organization."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate the knowledge base into our existing SharePoint or intranet?"
              answer: "Yes. Docsie lets you embed live knowledge base directly into SharePoint, your intranet, Microsoft Teams, or any website with a single line of code using our plugins and integrations. Employees get searchable, always-up-to-date M365 guides without leaving their work environment. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global Microsoft 365 deployments?"
              answer: "Absolutely. Record your Microsoft 365 training once, and Docsie generates knowledge base articles in 50+ languages. Perfect for global organizations where employees need M365 guides in English, Spanish, French, German, Mandarin, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for internal Microsoft 365 training content?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, integration with Azure AD, and advanced security features for internal knowledge base content."

