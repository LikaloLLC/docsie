    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting support videos to troubleshooting guides"
      faq_categories:
        - title: "Troubleshooting & Support"
          icon: "fas fa-life-ring"
          badge: "Most Popular"
          questions:
            - question: "How does the AI identify error messages and symptoms?"
              answer: "Docsie's multimodal AI watches your support videos and automatically identifies error messages (both spoken and displayed on-screen), recognizes error codes, extracts stack traces, and identifies symptom descriptions. It creates searchable indexes so users can find solutions by typing the exact error message or describing symptoms."
            - question: "Can this reduce our support ticket volume?"
              answer: "Yes. By converting support screencasts into searchable troubleshooting guides, users can self-serve and find solutions in seconds instead of opening tickets. Most teams see 40-60% reduction in repeat tickets for documented issues within the first month."
            - question: "How does it handle solutions that change between product versions?"
              answer: "The AI identifies product version references in your videos and can track which solutions apply to which versions. You can organize troubleshooting guides by product version, mark deprecated solutions, and cross-link to updated procedures."
        - title: "Content & Searchability"
          icon: "fas fa-search"
          questions:
            - question: "Can users search by error message to find the exact solution?"
              answer: "Absolutely. The generated troubleshooting guides are fully indexed by error message, error code, symptom description, and product area. Users type 'Error 500' or 'checkout fails' and immediately find the relevant solution guide—no watching videos or scrolling through long documents."
            - question: "What if our senior engineer's screencast doesn't explain the root cause verbally?"
              answer: "Docsie's visual AI watches what the engineer does on-screen—identifying the diagnostic steps, configuration changes, and solution implementation even if not verbally explained. It correlates actions with outcomes to create complete troubleshooting documentation."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

