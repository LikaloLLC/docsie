    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting videos to SOPs"
      faq_categories:
        - title: "SOP Structure & Format"
          icon: "fas fa-list-ol"
          badge: "Most Popular"
          questions:
            - question: "Does the AI automatically number procedure steps?"
              answer: "Yes. Docsie's AI analyzes the process flow in your training video and automatically creates numbered steps with hierarchical sub-steps. It identifies decision points, quality checkpoints, and branching procedures to create properly structured SOPs."
            - question: "Can I customize the SOP format for our quality management system?"
              answer: "Absolutely. The AI-generated SOP serves as a structured first draft that you can edit to match your company's SOP template, numbering system, and approval workflow. All procedure steps, quality checkpoints, and role assignments can be customized while maintaining the core structure."
            - question: "How does version control work for SOPs?"
              answer: "When you update a training video and regenerate the SOP, Docsie tracks the changes and maintains revision history. You can see exactly what changed between versions, supporting ISO and quality system change management requirements."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand quality checkpoints and acceptance criteria?"
              answer: "Yes. Our multimodal AI is trained on manufacturing and quality content. It recognizes quality hold points, inspection criteria, measurement requirements, and acceptance standards—ensuring SOPs include critical quality controls."
            - question: "Can I use this for ISO 9001 or other quality management systems?"
              answer: "Yes. Docsie generates SOPs with the elements quality auditors expect—numbered procedures, quality checkpoints, role assignments, and revision history. The format supports ISO 9001, AS9100, IATF 16949, and other quality management standards."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

