    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting project videos to client deliverables"
      faq_categories:
        - title: "Client Deliverables & Billing"
          icon: "fas fa-briefcase"
          badge: "Most Popular"
          questions:
            - question: "Can I brand the documentation with client logos and formatting?"
              answer: "Yes. The AI-generated documentation can be customized with your client's branding, logo, color scheme, and formatting preferences. You maintain full control over the final deliverable appearance while saving hours on content creation."
            - question: "Can I bill clients for documentation if AI generated it?"
              answer: "Absolutely. You're delivering professional documentation that meets client contractual requirements—how you create it efficiently is your competitive advantage. Most consultants include documentation deliverables in project scope and use Docsie to ensure profitability instead of scrambling to write docs after the project budget is spent."
            - question: "How does this handle implementation-specific details like custom fields and integrations?"
              answer: "Docsie's visual AI watches your implementation walkthroughs and identifies custom fields, configuration settings, integration points, and business logic. It documents what you built specifically for this client—not generic product documentation."
        - title: "Professional Quality"
          icon: "fas fa-star"
          questions:
            - question: "Is the documentation professional enough to hand to enterprise clients?"
              answer: "Yes. The AI generates structured, professionally formatted documentation that you can customize and polish. Many implementation consultants use Docsie to create the initial comprehensive draft, then refine specific sections—delivering better documentation in 90% less time."
            - question: "Can I create role-based documentation for different client user groups?"
              answer: "Yes. The AI can organize content by role—creating separate admin guides, end-user manuals, and technical specifications from the same training videos. This gives clients comprehensive documentation packages tailored to different user audiences."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

