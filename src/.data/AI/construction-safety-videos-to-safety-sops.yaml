    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting safety training to OSHA-compliant documentation"
      faq_categories:
        - title: "OSHA Compliance & Safety Documentation"
          icon: "fas fa-hard-hat"
          badge: "Most Popular"
          questions:
            - question: "Does this meet OSHA requirements for written safety programs and JSAs?"
              answer: "Yes. Docsie converts safety training videos into written site-specific safety plans and Job Safety Analyses (JSAs) that meet OSHA documentation requirements. The system structures hazard identification, safety controls, PPE requirements, and emergency procedures in formats suitable for OSHA inspections and includes worker training records."
            - question: "Can I use this to prepare for OSHA inspections?"
              answer: "Absolutely. Docsie generates documented safety procedures, toolbox talk records, and worker training documentation that OSHA inspectors require. The system converts safety training into written evidence of your safety program implementation—fall protection plans, excavation procedures, confined space programs, and competent person certifications."
            - question: "How does this help with insurance carrier safety audits?"
              answer: "Docsie converts safety training videos into documented evidence of your safety program implementation. Insurance carriers require written safety procedures and training records—not just videos. The system creates searchable JSAs, safety plans, and toolbox talk documentation that demonstrate proactive safety management and reduce EMR/loss ratios."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand construction safety terminology and OSHA standards?"
              answer: "Yes. Our multimodal AI is trained on construction safety and OSHA content. It recognizes fall protection terminology, excavation requirements, confined space procedures, hazard communication standards, and trade-specific safety controls—ensuring accurate documentation that doesn't misinterpret critical safety requirements."
            - question: "Can I customize the documentation for site-specific hazards and activities?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit to match your specific project hazards, site conditions, and construction activities. All safety controls, PPE requirements, and emergency procedures can be customized while maintaining OSHA compliance structure."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

