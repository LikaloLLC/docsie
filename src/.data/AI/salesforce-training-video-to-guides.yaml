    faq_v2:
      badge: "Common Questions"
      title: "Salesforce Training to Documentation FAQ"
      description: "Everything you need to know about creating multi-language Salesforce documentation"
      faq_categories:
        - title: "Salesforce-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Does Docsie document custom objects, Lightning Flows, and customizations?"
              answer: "Yes. Docsie's AI recognizes custom objects, Lightning Flows, Process Builder automations, custom Lightning components, validation rules, and workflow automations. It creates comprehensive documentation showing object schemas, flow logic, and how customizations work together."
            - question: "Can I create documentation in multiple languages for global Salesforce rollouts?"
              answer: "Absolutely. This is Docsie's superpower. Record your Salesforce training once in English, and Docsie automatically generates user guides, SOPs, and documentation in Spanish, French, German, Portuguese, Mandarin, Japanese, Korean, and 40+ more languages. Perfect for multinational implementations."
            - question: "Does it work for both Lightning Experience and Salesforce Classic?"
              answer: "Yes. Docsie documents both Lightning Experience and Salesforce Classic interfaces, as well as Salesforce Mobile App. It captures navigation, screen layouts, and creates tailored user guides for whichever interface your client uses."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate documentation into our existing client portals or SharePoint?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, client portals, your intranet, or any website with a single line of code using our plugins and integrations. Clients get searchable, always-up-to-date guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "How does the multi-language translation work?"
              answer: "Docsie uses AI-powered translation specifically trained for technical and business documentation. It understands Salesforce terminology, preserves custom object names and field labels, and maintains technical accuracy across all 50+ supported languages. You can also edit translations if needed."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential client Salesforce implementations?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, white-labeling, and advanced security features for confidential client documentation."

