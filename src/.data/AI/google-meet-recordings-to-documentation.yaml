      title: "Google Meet Recordings to Documentation FAQ"
      description: "Everything you need to know about converting Meet recordings"
      faq_categories:
        - title: "Google Workspace Integration"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Can Docsie access my Google Meet recordings directly from Google Drive?"
              answer: "Yes. You can connect your Google Drive account to upload Meet recordings automatically, or manually upload MP4 files from My Drive or Shared Drives. Docsie integrates with Google Workspace for seamless access."
            - question: "Can you extract content from Google Slides and Sheets shared during Meet calls?"
              answer: "Absolutely. Docsie uses OCR to read Google Slides presentations, Sheets spreadsheets, and any content shared during Meet calls. This includes text, data, charts, and code shown on screen."
            - question: "Does this work with recordings stored in Shared Drives?"
              answer: "Yes. Docsie works with recordings in My Drive, Shared Drives (Team Drives), and folders shared with you. Perfect for teams using Google Workspace collaboration features."
        - title: "Output & Delivery"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I save the documentation back to Google Drive?"
              answer: "Yes. Export documentation to Google Drive as structured docs, or publish to Docsie's white-labeled portals. You can also export to PDF, HTML, or Markdown for other systems."
            - question: "Can I create client-facing documentation from internal Meet recordings?"
              answer: "Absolutely. Transform internal training Meets into professional client documentation with your branding, custom domain, and white-labeled portals. Perfect for consulting and implementation projects."
