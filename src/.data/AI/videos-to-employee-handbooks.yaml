    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting HR videos to employee handbooks"
      faq_categories:
        - title: "Handbook Structure & Compliance"
          icon: "fas fa-file-alt"
          badge: "Most Popular"
          questions:
            - question: "Does the AI automatically organize policies into handbook sections?"
              answer: "Yes. Docsie's AI analyzes your HR and onboarding videos and automatically organizes content into logical policy sections—benefits, PTO, remote work, expenses, code of conduct, and compliance. It creates a proper handbook structure that employees can easily navigate."
            - question: "Can this meet HR compliance and employment law documentation requirements?"
              answer: "Yes. The AI-generated handbook provides documented policies that support HR compliance requirements. You can customize the content to meet specific federal, state, or international employment law documentation standards. The handbook serves as documented evidence of communicated policies."
            - question: "How do I handle location-specific or role-specific policies?"
              answer: "The AI can identify and organize content by location, department, or role. You can create separate handbook sections for different offices, remote vs. in-office employees, or department-specific policies. The system supports multi-version handbooks for different employee populations."
        - title: "Content & Updates"
          icon: "fas fa-sync-alt"
          questions:
            - question: "What if company policies change—can I update the handbook?"
              answer: "Absolutely. When you record updated policy training or HR updates, Docsie can regenerate affected handbook sections while maintaining version history. This makes it easy to keep employee handbooks current as policies evolve."
            - question: "Can employees easily search for specific policies?"
              answer: "Yes. The handbook is fully searchable—employees type their question ('PTO policy', 'remote work', 'expense reimbursement') and instantly find the relevant section. This dramatically reduces repetitive HR questions and improves employee self-service."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

