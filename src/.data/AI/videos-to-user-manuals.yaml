    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting videos to user manuals"
      faq_categories:
        - title: "Manual Structure & Format"
          icon: "fas fa-book-open"
          badge: "Most Popular"
          questions:
            - question: "Does the AI automatically organize content into manual chapters?"
              answer: "Yes. Docsie's AI analyzes your product demo or training video and automatically organizes content into logical chapters and sections. It creates a proper manual structure with introduction, feature sections, and troubleshooting—making it easy for users to navigate."
            - question: "Can I customize the manual format and branding?"
              answer: "Absolutely. The AI-generated manual serves as a comprehensive first draft that you can edit to match your product branding, manual template, and style guide. All chapters, screenshots, and instructions can be customized while maintaining the core content structure."
            - question: "How does this handle product screenshots and diagrams?"
              answer: "The AI automatically captures key moments from your product demo video—UI screens, feature demonstrations, and workflow steps—and inserts them as illustrations in the manual. This creates visual step-by-step guides that are easier for users to follow."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand product features and user workflows?"
              answer: "Yes. Our multimodal AI is trained on product documentation and user guides. It recognizes product features, UI elements, user workflows, and common product operations—ensuring the manual accurately reflects how users interact with your product."
            - question: "Can I ship this as official product documentation?"
              answer: "Yes. The AI-generated manual provides a solid foundation that you can refine and publish as official product documentation. Many teams use it to ship documentation on the same day as product releases, then refine details based on user feedback."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

