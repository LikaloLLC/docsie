    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting financial services training to regulatory documentation"
      faq_categories:
        - title: "FINRA & SEC Compliance"
          icon: "fas fa-balance-scale"
          badge: "Most Popular"
          questions:
            - question: "Does this meet FINRA Rule 3110 requirements for Written Supervisory Procedures?"
              answer: "Yes. Docsie converts supervisory training videos into documented Written Supervisory Procedures (WSPs) that meet FINRA Rule 3110 requirements. The system structures supervision points, escalation procedures, and exception reporting in a format suitable for FINRA examinations and includes audit trails for all changes."
            - question: "Can I use this for SEC Rule 17a-4 recordkeeping compliance?"
              answer: "Absolutely. Docsie generates documentation with timestamps, version control, and metadata preservation that support SEC Rule 17a-4 recordkeeping requirements. The system maintains a complete audit trail for compliance documentation."
            - question: "How does this help with AML training documentation for Bank Secrecy Act compliance?"
              answer: "Docsie converts AML/KYC training videos into written compliance procedures that demonstrate compliance with Bank Secrecy Act requirements and FINRA Rule 3310. The AI automatically identifies red flag scenarios, CIP requirements, sanctions screening procedures, and suspicious activity reporting obligations."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand financial regulatory terminology?"
              answer: "Yes. Our multimodal AI is trained on financial services and regulatory content. It recognizes FINRA rules, SEC regulations, AML terminology, supervisory procedures, and broker-dealer compliance concepts—ensuring accurate documentation that doesn't misinterpret critical regulatory requirements."
            - question: "Can I customize the documentation for our compliance management system?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit to match your firm's compliance procedures and policy numbering system. All regulatory citations, supervision points, and compliance workflows can be customized while maintaining audit trail integrity."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

