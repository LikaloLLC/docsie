    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about live stream-to-documentation conversion"
      faq_categories:
        - title: "How It Works"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Can you process Twitch VODs and YouTube Live streams?"
              answer: "Yes! You can provide Twitch VOD URLs, YouTube Live recording URLs, or upload downloaded stream archives. We support all major streaming platforms."
            - question: "How does it handle very long streams (8+ hours)?"
              answer: "Our system efficiently processes long-form content by breaking it into logical chapters and topics. Processing time is typically 15-20% of stream duration, so an 8-hour stream takes about 90 minutes."
            - question: "Can it detect different topics within a stream?"
              answer: "Absolutely! The AI automatically identifies topic changes, game switches, Q&A sessions, and different stream segments to create organized chapters."
        - title: "Quality & Accuracy"
          icon: "fas fa-check-circle"
          questions:
            - question: "How accurate is the transcription with gaming terminology?"
              answer: "Our AI is trained on gaming, technical, and streaming-specific terminology. It understands game names, character names, abilities, and community jargon with 95%+ accuracy."
            - question: "Can I edit the generated documentation?"
              answer: "Absolutely! The AI-generated documentation serves as a solid first draft that you can edit, refine, and customize using Docsie's built-in editor. All formatting and structure is preserved."
