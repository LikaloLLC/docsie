          questions:
            - question: "Does Docsie document Power Platform customizations?"
              answer: "Yes. Docsie's AI recognizes Power Apps, Power Automate flows, custom entities, business process flows, and Power Platform integrations. It creates comprehensive documentation showing how custom solutions work, making client handover seamless."
            - question: "Can I document both Dynamics 365 and Power Platform in one guide?"
              answer: "Absolutely. Docsie documents the complete solution—D365 modules, Power Apps, Power Automate workflows, custom entities, and integrations—in a single comprehensive guide. Perfect for showing clients how all pieces work together."
            - question: "Does it work for D365 Sales, Finance & Operations, and Customer Service?"
              answer: "Yes. Docsie works with all Dynamics 365 modules including Sales, Finance & Operations, Customer Service, Field Service, Project Operations, and custom Power Platform solutions. It captures module-specific navigation and creates tailored user guides."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate documentation into our existing client portals or SharePoint?"
              answer: "Yes. Docsie lets you embed live documentation directly into SharePoint, client portals, your intranet, or any website with a single line of code using our plugins and integrations. Clients get searchable, always-up-to-date guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global D365 rollouts?"
              answer: "Absolutely. Record your D365 training once, and Docsie generates client documentation in 50+ languages. Perfect for multinational implementations where clients need guides in English, Spanish, German, French, Mandarin, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential client implementations?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, white-labeling, and advanced security features for confidential client documentation."

