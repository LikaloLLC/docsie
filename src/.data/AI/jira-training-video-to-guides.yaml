      title: "Jira Training to Workflow Documentation FAQ"
      description: "Everything you need to know about creating Jira workflow documentation"
      faq_categories:
        - title: "Jira-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Does Docsie create visual workflow diagrams from Jira training videos?"
              answer: "Yes. Docsie's AI analyzes Jira workflow training and creates visual workflow diagrams showing workflow states, transitions, conditions, validators, post-functions, and automation rules. These diagrams help teams understand custom workflows at a glance."
            - question: "Can I document both Jira Software and Jira Service Management?"
              answer: "Absolutely. Docsie documents Jira Software (agile workflows, boards, sprints), Jira Service Management (service desk, request types, SLAs), Jira Work Management, and custom Jira configurations in comprehensive workflow documentation."
            - question: "Does it document Jira automation rules and JQL queries?"
              answer: "Yes. Docsie recognizes automation rules (triggers, conditions, actions), JQL queries, advanced filters, and custom integrations. It creates documentation showing how automation works and when rules fire."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate Jira documentation into our Confluence or knowledge base?"
              answer: "Yes. Docsie lets you embed live documentation directly into Confluence, SharePoint, your intranet, or any website with a single line of code using our plugins and integrations. Teams get searchable, always-up-to-date Jira workflow guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support multi-language for global Jira deployments?"
              answer: "Absolutely. Record your Jira training once, and Docsie generates workflow documentation in 50+ languages. Perfect for multinational teams where users need Jira guides in English, Spanish, French, German, Japanese, etc."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential Jira workflows and projects?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, IP allowlisting, and advanced security features for confidential workflow documentation."

