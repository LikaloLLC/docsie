          questions:
            - question: "Can you process entire podcast series at once?"
              answer: "Yes! You can batch upload multiple episodes or provide an RSS feed URL and we'll process your entire back catalog, creating a searchable archive of all episodes."
            - question: "What audio formats are supported?"
              answer: "We support all major audio formats including MP3, WAV, M4A, AAC, FLAC, and more. You can also provide video files (MP4, MOV) and we'll extract the audio track."
            - question: "How long does the conversion process take?"
              answer: "Processing time varies by episode length, but typically runs at about 15-20% of the audio duration. A 60-minute episode is usually ready in 10-15 minutes."
