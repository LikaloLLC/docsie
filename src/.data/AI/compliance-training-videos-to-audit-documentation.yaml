    faq_v2:
      badge: "Common Questions"
      title: "Compliance Training Documentation FAQ"
      description: "Everything you need to know about converting compliance training to audit documentation"
      faq_categories:
        - title: "Regulatory Compliance"
          icon: "fas fa-shield-alt"
          badge: "Most Popular"
          questions:
            - question: "Does this meet SOC 2 audit evidence requirements for employee training?"
              answer: "Yes. Docsie converts security awareness and compliance training videos into documented evidence that SOC 2 auditors accept. The system maps training content to specific Trust Service Criteria (TSC), generates completion records with timestamps and covered topics, and exports audit-ready reports showing proof of employee training on access controls, data handling, and incident response."
            - question: "Can I use this for ISO 27001 certification audits?"
              answer: "Absolutely. Docsie transforms information security training into ISO 27001-compliant documentation mapped to Annex A controls and ISMS requirements. Certification auditors receive evidence of employee awareness training with linkage to your security policies, procedures, and risk treatment plans—supporting both initial certification and annual surveillance audits."
            - question: "How does this work for HIPAA compliance and HHS audits?"
              answer: "Docsie converts HIPAA training videos into searchable documentation organized by Privacy Rule, Security Rule, and Breach Notification requirements. The system generates training completion records with documented proof of PHI handling training, patient rights education, and business associate compliance—providing evidence during HHS audits and investigations."
        - title: "Integration & Export"
          icon: "fas fa-plug"
          questions:
            - question: "Can I export training documentation to Vanta, Drata, or other GRC platforms?"
              answer: "Yes. Docsie integrates with major GRC platforms including Vanta, Drata, SecureFrame, and Compliance.ai. Training documentation automatically syncs as audit evidence, updates compliance monitoring dashboards, and flows into automated audit evidence collection workflows—eliminating manual documentation gathering during audits."
            - question: "What formats can I export audit documentation in?"
              answer: "Docsie exports compliance training documentation in multiple auditor-friendly formats: PDF reports for external auditors, Excel spreadsheets for training tracking matrices, Word documents for policy appendices, and JSON/API for GRC platform integration. All exports include training completion records, policy references, and regulatory framework mapping."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

