          questions:
            - question: "Does Docsie document custom HubSpot workflows, sequences, and automation?"
              answer: "Yes. Docsie's AI recognizes custom workflows, email sequences, marketing automation, deal pipelines, ticket automation, and HubSpot integrations. It creates comprehensive client documentation showing how everything works together for successful client onboarding."
            - question: "Can I document all HubSpot Hubs in one client handover package?"
              answer: "Absolutely. Docsie documents the complete HubSpot implementation—Marketing Hub campaigns, Sales Hub sequences, Service Hub ticketing, CMS Hub websites, and Operations Hub automation—in a single comprehensive client handover package."
            - question: "Does it work for HubSpot Marketing, Sales, Service, and CMS Hubs?"
              answer: "Yes. Docsie works with all HubSpot Hubs including Marketing Hub, Sales Hub, Service Hub, CMS Hub, Operations Hub, and custom integrations. It creates hub-specific user guides and cross-hub workflow documentation."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Can I integrate client documentation into their existing systems or portal?"
              answer: "Yes. Docsie lets you embed live documentation directly into client portals, SharePoint, their intranet, or any website with a single line of code using our plugins and integrations. Clients get searchable, always-up-to-date HubSpot guides without leaving their systems. You can also export to PDF, HTML, Markdown, or Word if needed."
            - question: "Does it support creating documentation for multiple clients at once?"
              answer: "Absolutely. Docsie is built for agencies and partners managing multiple client implementations. You can create separate documentation workspaces for each client, customize branding per client, and efficiently scale your client documentation process."
        - title: "Security & Compliance"
          icon: "fas fa-lock"
          questions:
            - question: "Is Docsie secure for confidential client HubSpot implementations?"
              answer: "Yes. All training videos are encrypted in transit and at rest. We never share your content. You can delete videos anytime. Enterprise plans include SSO, white-labeling, and client-specific workspaces for confidential implementation documentation."

