    faq_v2:
      badge: "Common Questions"
      title: "Epic Training to Compliant Documentation FAQ"
      description: "Everything you need to know about creating HIPAA-compliant Epic documentation"
      faq_categories:
        - title: "Epic Healthcare-Specific Features"
          icon: "fas fa-cog"
          badge: "Most Popular"
          questions:
            - question: "Is Docsie HIPAA-compliant for Epic healthcare training videos?"
              answer: "Yes. Docsie is designed for healthcare documentation with built-in PHI protection, encryption in transit and at rest, automatic PHI redaction in screenshots, BAA agreements for Enterprise plans, and compliance with HIPAA requirements for ePHI handling."
            - question: "Does Docsie understand Epic activities, SmartSets, and clinical workflows?"
              answer: "Yes. Docsie's AI recognizes Epic activities, SmartSets, preference lists, order sets, clinical workflows, and Epic navigation patterns. It creates comprehensive clinical documentation showing Epic workflows for patient care scenarios."
            - question: "Can I document Epic Ambulatory, Inpatient, Beaker, and specialty modules?"
              answer: "Absolutely. Docsie works with all Epic modules including Ambulatory, Inpatient, Emergency Department, Beaker (Lab), Radiant (Radiology), Willow (Pharmacy), OpTime (OR), Cogito (Analytics), MyChart, and custom Epic builds."
        - title: "Compliance & Security"
          icon: "fas fa-lock"
          badge: "Healthcare"
          questions:
            - question: "How does Docsie handle PHI in Epic training videos?"
              answer: "Docsie automatically redacts PHI (patient names, MRNs, dates of birth, addresses) from screenshots and documentation. Videos are encrypted end-to-end, stored in HIPAA-compliant infrastructure, and never shared. You can delete videos anytime. Enterprise plans include BAA agreements."
            - question: "Can I integrate Epic documentation into our clinical knowledge base?"
              answer: "Yes. Docsie lets you embed live documentation directly into your clinical knowledge base, Epic UserWeb, SharePoint, or intranet with a single line of code using our HIPAA-compliant plugins. Clinical staff get searchable, always-up-to-date Epic guides without leaving their workflow."
        - title: "Output & Integration"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does it support creating role-specific Epic documentation?"
              answer: "Absolutely. You can create role-specific Epic documentation for physicians, nurses, medical assistants, lab technicians, pharmacists, and administrative staff. Organize documentation by clinical role, department, or specialty for targeted training."

