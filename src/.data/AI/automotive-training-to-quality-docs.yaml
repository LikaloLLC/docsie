    faq_v2:
      badge: "Common Questions"
      title: "Frequently Asked Questions"
      description: "Everything you need to know about converting automotive training to IATF 16949-compliant documentation"
      faq_categories:
        - title: "IATF 16949 & PPAP Compliance"
          icon: "fas fa-car"
          badge: "Most Popular"
          questions:
            - question: "Does this meet IATF 16949 requirements for documented work instructions?"
              answer: "Yes. Docsie converts assembly training videos into work instructions that meet IATF 16949 requirements for documented manufacturing processes. The system structures assembly steps, quality checkpoints, torque specifications, and critical dimensions in formats suitable for customer audits and PPAP submissions."
            - question: "Can I use this for PPAP documentation and customer submissions?"
              answer: "Absolutely. Docsie generates documented work instructions, process flows, and quality procedures that support PPAP (Production Part Approval Process) requirements. The system converts training videos into evidence of process validation and operator instruction that automotive customers require for new part launches."
            - question: "How does this help with APQP and control plan documentation?"
              answer: "Docsie converts APQP training and process videos into documented procedures that link to your control plan and FMEA. The AI automatically identifies special characteristics, quality checkpoints, and process parameters that need to be tracked in your control plan and documented for customer-specific requirements."
        - title: "Content & Quality"
          icon: "fas fa-check-circle"
          questions:
            - question: "Does the AI understand automotive manufacturing terminology and quality concepts?"
              answer: "Yes. Our multimodal AI is trained on automotive manufacturing and quality content. It recognizes IATF 16949 terminology, APQP requirements, special characteristics, torque specifications, assembly procedures, and quality control methods—ensuring accurate documentation that doesn't misinterpret critical manufacturing or quality requirements."
            - question: "Can I customize the documentation for customer-specific requirements?"
              answer: "Yes. The AI-generated documentation serves as a structured first draft that you can edit to match specific customer requirements (GM, Ford, Toyota, etc.) and your plant's work instruction format. All assembly steps, quality checkpoints, and process parameters can be customized while maintaining IATF 16949 compliance structure."
      cta:
        text: "Book a Demo"
        url: "/demo/"
        pretext: "Still have questions?"

