<div class="cookie-policy">
  <aside tabindex="0" role="alertdialog" class="cookie-policy-alert" aria-labelledby="cookie-policy-title"
    aria-describedby="cookie-policy-content">
    <h2 id="cookie-policy-title" class="off-screen">
     {% trans %} Cookie policy notification {% endtrans %}
    </h2>
    <span class="cookie-policy-content" id="cookie-policy-content" role="document" tabindex="0"> {%trans%} We use cookies to
      improve your experience. By your continued use of
      this site you accept such use. {% endtrans %}<br>  {%trans%} This notice will disappear by
      itself.{% endtrans %}
      <button class="cookie-policy-close" aria-label="Close this cookie policy notification"> {% trans %} Close {% endtrans %}</button>
    </span>
  </aside>
</div>
<script type="text/javascript">
  "use strict";
  document.addEventListener('DOMContentLoaded', function() {
    var policy = document.querySelector(".cookie-policy-alert");
    if (!policy) return;

    var policyHide = 15000;

    function hidePolicy() {
      policy.style.display = "none";
      localStorage.setItem("docsie-cookie-policy", true);
    }

    if (!localStorage.getItem("docsie-cookie-policy")) {
      var closeButton = policy.querySelector(".cookie-policy-close");
      if (closeButton) {
        closeButton.addEventListener("click", hidePolicy);
      }
      policy.style.display = "block";
      setTimeout(hidePolicy, policyHide);
    }
  });
</script>
