{% if section %}
<!-- Video Demo V2 - Polished Design System -->
<section class="section-shell bg-warm">
  <div class="section-inner">

    <!-- Section Header -->
    <div class="text-center mb-12">
      {% if section.badge %}
      <p class="eyebrow mb-4">{{ section.badge }}</p>
      {% endif %}

      <h2 class="heading-xl text-headline-warm mb-4">
        {{ section.title }}
      </h2>

      {% if section.description %}
      <p class="body-lg text-body-warm max-w-3xl mx-auto">
        {{ section.description }}
      </p>
      {% endif %}
    </div>

    <!-- Video Container -->
    <div class="max-w-5xl mx-auto">
      <div class="bento-card group">
        <div class="relative rounded-2xl overflow-hidden">
          <video
            class="w-full h-auto transition-transform duration-300 group-hover:scale-101"
            {% if section.controls %}controls{% endif %}
            {% if section.autoplay %}autoplay muted loop{% endif %}
            {% if section.poster %}poster="{{ section.poster }}"{% endif %}
            playsinline>
            <source src="{{ section.video_url }}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>

      <!-- Optional Note -->
      {% if section.note %}
      <p class="text-center text-sm text-body-warm mt-6">
        {{ section.note }}
      </p>
      {% endif %}

      <!-- Optional CTA -->
      {% if section.cta %}
      <div class="text-center mt-8">
        <a href="{{ section.cta.url }}" class="btn-primary-warm">
          {{ section.cta.text }}
          <svg class="ml-2 w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
          </svg>
        </a>
      </div>
      {% endif %}
    </div>

  </div>
</section>
{% endif %}
